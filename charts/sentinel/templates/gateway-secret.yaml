{{- if and .Values.gateway.enabled .Values.gateway.token (not .Values.gateway.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.gatewaySecretName" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gateway.token | quote }}
{{- end }}
