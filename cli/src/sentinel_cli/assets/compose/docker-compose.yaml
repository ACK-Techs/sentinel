name: sentinel-compose

services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sentinel-internal

  loki:
    image: grafana/loki:3.6.7
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sentinel-internal

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - ./tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sentinel-internal

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "${GRAFANA_AUTH_ANONYMOUS_ENABLED:-false}"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sentinel-internal

  sentinel-gateway:
    image: "${SENTINEL_GATEWAY_IMAGE:-ghcr.io/caglarkc/sentinel-gateway:latest}"
    ports:
      - "${SENTINEL_GATEWAY_PORT:-8091}:8091"
    environment:
      SENTINEL_OBSERVABILITY_GATEWAY_TOKEN: "${SENTINEL_OBSERVABILITY_GATEWAY_TOKEN:-lab-gateway-token}"
      SENTINEL_OBSERVABILITY_PROMETHEUS__BASE_URL: "http://prometheus:9090"
      SENTINEL_OBSERVABILITY_LOKI__BASE_URL: "http://loki:3100"
      SENTINEL_OBSERVABILITY_TEMPO__BASE_URL: "http://tempo:3200"
      SENTINEL_OBSERVABILITY_HTTP__TIMEOUT_SEC: "${SENTINEL_OBSERVABILITY_HTTP_TIMEOUT_SEC:-10}"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --header='Authorization: Bearer ${SENTINEL_OBSERVABILITY_GATEWAY_TOKEN:-lab-gateway-token}' --spider http://127.0.0.1:8091/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sentinel-internal

networks:
  sentinel-internal:
    driver: bridge
    internal: true

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
