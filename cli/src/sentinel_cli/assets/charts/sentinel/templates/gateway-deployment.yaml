{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-gateway
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "sentinel.gatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.gatewaySelectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.gateway.podSecurityContext | nindent 8 }}
      containers:
        - name: sentinel-gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.service.port }}
              protocol: TCP
          env:
            {{- range $name, $config := .Values.gateway.env }}
            - name: {{ $name }}
              {{- if $config.valueFrom }}
              valueFrom:
                {{- if eq $name "SENTINEL_OBSERVABILITY_GATEWAY_TOKEN" }}
                secretKeyRef:
                  name: {{ include "sentinel.gatewaySecretName" $ }}
                  key: {{ $config.valueFrom.secretKeyRef.key | default "token" }}
                {{- else }}
                {{- toYaml $config.valueFrom | nindent 16 }}
                {{- end }}
              {{- else }}
              value: {{ tpl ($config.value | toString) $ | quote }}
              {{- end }}
            {{- end }}
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'wget -q -O /dev/null --header="Authorization: Bearer ${SENTINEL_OBSERVABILITY_GATEWAY_TOKEN}" http://127.0.0.1:8091/health'
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - 'wget -q -O /dev/null --header="Authorization: Bearer ${SENTINEL_OBSERVABILITY_GATEWAY_TOKEN}" http://127.0.0.1:8091/health'
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.gateway.securityContext | nindent 12 }}
{{- end }}
