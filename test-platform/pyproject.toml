[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "sentinel-test-platform"
version = "0.1.0"
description = "Phase 1 multi-service target platform for Sentinel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1.0",
  "kubernetes>=30.1,<31.0",
  "mypy>=1.11,<2.0",
  "PyYAML>=6.0,<7.0",
  "ruff>=0.11,<0.12",
  "types-PyYAML>=6.0.12.20241230",
  "ulid-py>=1.1,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
pretty = true
explicit_package_bases = true
namespace_packages = true
exclude = [
  "^runs/",
]
