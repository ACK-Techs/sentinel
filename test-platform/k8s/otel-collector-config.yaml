apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: sentinel-target
data:
  config.yaml: |
    # Legacy local collector path. The active COS topology sends telemetry
    # directly to otel-collector.cos.svc.cluster.local:4317.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
