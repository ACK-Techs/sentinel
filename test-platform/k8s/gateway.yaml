apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-chaos
  namespace: sentinel-target
data:
  profile.yaml: |
    profile: healthy
    error_rate: 0.0
    error_status: 503
    latency_p50_ms: 0
    latency_p99_ms: 0
    cpu_burn: false
    downstream_block: []
    memory_leak_kb_per_req: 0
    db_slow: 0
    downstream_timeout_ms: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sentinel-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: sentinel/gateway:phase1
          ports:
            - containerPort: 8080
          env:
            - {name: DEPLOYMENT_ENV, value: dev}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: otel-collector.cos.svc.cluster.local:4317}
            - {name: OTEL_SERVICE_NAME, value: gateway}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: service.namespace=sentinel-target}
            - {name: ORDERS_URL, value: http://orders:8080}
            - {name: INVENTORY_URL, value: http://inventory:8080}
            - {name: CHAOS_TOKEN, value: sentinel-chaos-token}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          volumeMounts:
            - {name: chaos, mountPath: /etc/chaos}
      volumes:
        - name: chaos
          configMap:
            name: gateway-chaos
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sentinel-target
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
